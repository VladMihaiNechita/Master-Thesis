# ViT-Large + Standard Decoder
size: large

image_size: 224  # Square image
image_channels: 3
patch_size: 16  # Square patch

encoder_hidden_size: 1024
encoder_num_heads: 16
encoder_num_layers: 24
encoder_mlp_ratio: 4.0

decoder_hidden_size: 512
decoder_num_heads: 16
decoder_num_layers: 8
decoder_mlp_ratio: 4.0

norm_pix_loss: false

train_batch_size: 4000
train_mini_batch_size: 1000
base_learning_rate: 1.5e-4
betas: [0.9, 0.95]
weight_decay: 0.05
train_mask_ratio: 0.75

# gaussian_blurred_noise, spectrum, styleGAN-random, real_video, irc
generator_name: irc
number_of_pretraining_images: 100000000  # 100_000_000
checkpoint_every: 4000000  # 5_000_000