# ViT-Base + Standard Decoder
size: base

image_size: 224  # Square image
image_channels: 3
patch_size: 16  # Square patch

encoder_hidden_size: 768
encoder_num_heads: 12
encoder_num_layers: 12
encoder_mlp_ratio: 4.0

decoder_hidden_size: 512
decoder_num_heads: 16
decoder_num_layers: 8
decoder_mlp_ratio: 4.0

norm_pix_loss: false

train_batch_size: 4000
train_mini_batch_size: 800
base_learning_rate: 1.5e-4
betas: [0.9, 0.95]
weight_decay: 0.05
train_mask_ratio: 0.75

# gaussian_blurred_noise, spectrum, styleGAN-random, real_video, irc
generator_name: irc
irc_buffer_device: cuda
number_of_pretraining_images: 100000000  # 100_000_000
checkpoint_every: 4000000  # 4_000_000


# 4000, 4000, 4000000, 100000000
# 2000, 4000, 4000000, 100000000
# 1334, 4002, 4002000, 100050000
# 1000, 4000, 4000000, 100000000
